<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Java Script Assignment</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body>

    <div class="container-fluid">
        <div class="row justify-content-center my-3">
            <div class="col-6">
                <div class="card">
                    <div class="card-header bg-primary text-white">
                        <strong><i class="fa fa-arrow-circle-right"></i> Calculations in JavaScript </strong>
                    </div>
                    <div class="card-body">
                        <div class="mb-3">
                            <button type="button" class="btn btn-primary" onclick="addition()">
                                Addition
                            </button>
                            <button type="button" class="btn btn-primary" onclick="subtraction()">
                                Subtraction
                            </button>
                            <button type="button" class="btn btn-primary" onclick="multiplication()">
                                Multiplication
                            </button>
                            <button type="button" class="btn btn-primary" onclick="division()">
                                Division
                            </button>
                            <button type="button" class="btn btn-primary" onclick="squareRoot()">
                                Square Root
                            </button>
                            <button type="button" class="btn btn-primary" onclick="square()">
                                Square
                            </button>
                        </div>
                        <div class="mb-3">
                            <button type="button" class="btn btn-primary" onclick="factorial()">
                                Factorial
                            </button>
                            <button type="button" class="btn btn-primary" onclick="remainder()">
                                Remainder
                            </button>
                            <button type="button" class="btn btn-primary" onclick="power()">
                                Power
                            </button>
                            <button type="button" class="btn btn-primary" onclick="absoluteValue()">
                                Absolute Value
                            </button>
                            <button type="button" class="btn btn-primary" onclick="average()">
                                Average
                            </button>
                            <button type="button" class="btn btn-primary" onclick="maximum()">
                                Maximum
                            </button>
                        </div>
                        <div class="mb-3">
                            <button type="button" class="btn btn-primary" onclick="minimum()">
                                Minimum
                            </button>
                            <button type="button" class="btn btn-primary" onclick="round()">
                                Round
                            </button>
                            <button type="button" class="btn btn-primary" onclick="percentage()">
                                Percentage
                            </button>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>



    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/js/bootstrap.bundle.min.js"></script>

    <script>

        // 1. Addition Function
        function addition() {
            const num1 = + prompt("Enter First Number: ");
            const num2 = + prompt("Enter Second Number: ");
            const result = num1 + num2;
            alert(` The Result is ${result}`);
        }

        // 2. Subtraction Function
        function subtraction() {
            const num1 = + prompt("Enter First Number: ");
            const num2 = + prompt("Enter Second Number: ");
            const result = num1 - num2;
            alert(` The Result is ${result}`);
        }

        // 3. Multiplication Function
        function multiplication() {
            const num1 = + prompt("Enter First Number: ");
            const num2 = + prompt("Enter Second Number: ");
            const result = num1 * num2;
            alert(` The Result is ${result}`);
        }

        // 4. Division Function
        function division() {
            const num1 = + prompt("Enter First Number: ");
            const num2 = + prompt("Enter Second Number: ");

            if (num2 === 0) {
                alert("Error! Can't by divided");
            } else {
                const result = num1 / num2;
                alert(` The Result is ${result}`);
            }
        }

        // 5. Square Root Function
        function squareRoot() {
            const num = + prompt("Enter Number: ");

            if (num < 0) {
                alert("Error! can't calculate square root of a neagative value");
            }
            else {
                const result = Math.sqrt(num);
                alert(` The result is ${result} `);
            }
        }

        // 6. Square Function
        function square() {
            const num = + prompt("Enter number: ");
            const result = num * num;
            alert(` The reslut is ${result}`);
        }

        // 7. Factorial Function
        function factorial() {
            const num = + prompt("Enter a positive integer:");

            if (num < 0) {
                alert("Error: Factorial is not defined for negative numbers!");
            } else {
                const result = 1;
                for (const i = 2; i <= num; i++) {
                    result *= i;
                }
                alert(`The factorial is: ${result}`);
            }
        }

        // 8. Remainder Function
        function remainder() {
            const num1 = + prompt("Enter First Number");
            const num2 = + prompt("Enter Second Number");
            if (num2 === 0) {
                alert("Error: Cannot divide by zero!");
            } else {
                const result = num1 % num2;
                alert(` The result is ${result}`);
            }
        }

        // 9. Power Function
        function power() {
            const base = + prompt("Enter base");
            const exponent = + prompt("Enter exponent");
            const result = Math.pow(base, exponent);
            alert(` The power is ${result}`);
        }

        // 10. Absolute Value Function
        function absoluteValue() {
            const num = + prompt("Enter Number: ");
            const reslut = Math.abs(num);
            alert(` The result is ${reslut}`);
        }

        // 11. Average Function
        function average() {
            const num1 = + prompt("Enter First number: ");
            const num2 = + prompt("Enter Second number: ");
            const num3 = + prompt("Enter Third number: ");
            const result = (num1 + num2 + num3) / 3;
            alert(` The Result is ${result}`);
        }

        // 12. Maximum Function
        function maximum(){
            const num1 = + prompt("Enter First number: ");
            const num2 = + prompt("Enter Second number: ");
            const reslut = num1 > num2 ? num1 : num2;
            alert(` The result is ${reslut}`);
        }

        // 13. Minimum Function
        function minimum(){
            const num1 = + prompt("Enter First number: ");
            const num2 = + prompt("Enter Second number: ");
            const reslut = num1 < num2 ? num1 : num2;
            alert(` The result is ${reslut}`);
        }

        // 14. Round Function
        function round(){
            const num = + prompt("Enter number: ");
            const reslut = Math.round(num);
            alert(` The Result is ${reslut} `);
        }

        // 15. Percentage Function
        function percentage(){
            const num = + prompt("Enter number: ");
            const percent = + prompt("Enter Percent: ");
            const reslut = (num * percent) / 100;
            alert(`${percent}% of ${num} is ${reslut} `);
        }

    </script>

</body>

</html>
